<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Galería de Propiedad</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a1a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }

  .slider {
    position:relative;
    width:100%;
    max-width:1563px;
    aspect-ratio: 1/1;
    overflow:hidden;
    border-radius:12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    border: 2px solid #C9A227; /* dorado */
  }

  .slide {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition: opacity 0.7s ease-in-out;
  }

  .slide.active {
    opacity:1;
    z-index:1;
  }

  /* Flechas de navegación */
  .arrow {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background: rgba(0,0,0,0.55);
    color:#C9A227;
    border:none;
    font-size:26px;
    width:44px;
    height:44px;
    border-radius:50%;
    cursor:pointer;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background 0.2s;
  }
  .arrow:hover { background: rgba(0,0,0,0.8); }
  .prev { left:14px; }
  .next { right:14px; }

  /* Contador */
  .counter {
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    background: rgba(0,0,0,0.55);
    color:#F5EFE0; /* beige */
    padding:4px 12px;
    border-radius:20px;
    font-size:13px;
    z-index:2;
    letter-spacing:0.5px;
  }

  /* Puntos de navegación */
  .dots {
    position:absolute;
    bottom:14px;
    right:14px;
    display:flex;
    gap:6px;
    z-index:2;
  }
  .dot {
    width:8px;
    height:8px;
    border-radius:50%;
    background: rgba(245,239,224,0.5);
    cursor:pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .dot.active {
    background: #C9A227;
    transform: scale(1.3);
  }
</style>
</head>
<body>

<div class="slider" id="slider">
  <!-- 
    INSTRUCCIONES:
    Reemplaza cada URL de "src" por el link directo de tu foto
    (puedes subir las fotos a GitHub, Imgur, o Google Drive con link público).
    Agrega o quita bloques <img class="slide"> según la cantidad de fotos.
  -->
  <img class="slide active" src="fotos/foto1.png">
    <img class="slide" src="fotos/foto2.png">
    <img class="slide" src="fotos/foto3.png">
    <img class="slide" src="fotos/foto4.png">
    <img class="slide" src="fotos/foto5.png">

  <button class="arrow prev" onclick="changeSlide(-1)">&#10094;</button>
  <button class="arrow next" onclick="changeSlide(1)">&#10095;</button>

  <div class="counter" id="counter">1 / 4</div>
  <div class="dots" id="dots"></div>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const counter = document.getElementById('counter');
  const dotsContainer = document.getElementById('dots');
  let current = 0;

  // Crear puntos dinámicamente
  slides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.classList.add('dot');
    if (i === 0) dot.classList.add('active');
    dot.onclick = () => goToSlide(i);
    dotsContainer.appendChild(dot);
  });
  const dots = document.querySelectorAll('.dot');

  function update() {
    slides.forEach((s, i) => s.classList.toggle('active', i === current));
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
    counter.textContent = (current + 1) + ' / ' + slides.length;
  }

  function changeSlide(dir) {
    current = (current + dir + slides.length) % slides.length;
    update();
  }

  function goToSlide(i) {
    current = i;
    update();
  }

  // Autoplay opcional (comenta estas 3 líneas si no lo quieres)
  setInterval(() => {
    changeSlide(1);
  }, 5000);
</script>

</body>
</html>
